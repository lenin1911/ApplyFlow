version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: applyflow-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-applyflow}
      POSTGRES_USER: ${POSTGRES_USER:-applyflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-applyflow_user} -d ${POSTGRES_DB:-applyflow}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: applyflow-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECURITY_KEY: ${SECURITY_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000,http://127.0.0.1:8000}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
