databases:
  # PostgreSQL Database Service
  - name: applyflow-db
    databaseName: applyflow
    user: applyflow_user
    plan: free

services:
  # FastAPI Backend Web Service
  - type: web
    name: applyflow-backend
    env: python
    buildCommand: pip install uv && uv sync && uv run alembic upgrade head
    startCommand: uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: applyflow-db
          property: connectionString
      - key: SECURITY_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: ALLOWED_ORIGINS
        value: https://applyflow-frontend.onrender.com

  # React Frontend Static Site
  - type: static
    name: applyflow-frontend
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://applyflow-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
